name: Validacao ChatForAll
on:
  push:
    branches:
      - fix/auth-email-senha-segura-20261109
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@10.4.1
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm check
      - name: Testes
        run: pnpm test
      - name: Build
        run: pnpm build
