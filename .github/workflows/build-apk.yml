name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Native ChatForAll APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | head -n 1 | awk -F'"' '{print $2}')
          echo "Building ChatForAll version: $VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          mkdir -p release-apk
          mkdir -p client/public
          mkdir -p dist/public
          
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          
          cp "$APK_SRC" "release-apk/ChatForAll-v${VERSION_NAME}.apk"
          cp "$APK_SRC" "release-apk/ChatForAll.apk"
          cp "$APK_SRC" "ChatForAll-v${VERSION_NAME}.apk"
          cp "$APK_SRC" "ChatForAll.apk"
          cp "$APK_SRC" "client/public/ChatForAll-v${VERSION_NAME}.apk"
          cp "$APK_SRC" "client/public/ChatForAll.apk"
          cp "$APK_SRC" "dist/public/ChatForAll-v${VERSION_NAME}.apk"
          cp "$APK_SRC" "dist/public/ChatForAll.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatForAll-APK
          path: release-apk/*
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push APK directly to repository
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | head -n 1 | awk -F'"' '{print $2}')
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "ChatForAll-v${VERSION_NAME}.apk" ChatForAll.apk "client/public/ChatForAll-v${VERSION_NAME}.apk" client/public/ChatForAll.apk
          git commit -m "chore(release): publish ChatForAll-v${VERSION_NAME}.apk [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
